<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .gallery {
    column-count: 3;
    column-gap: 4px;
    padding: 4px;
  }

  .gallery a {
    display: block;
    position: relative;
    margin-bottom: 4px;
    line-height: 0;
    break-inside: avoid;
    cursor: pointer;
  }

  .gallery img.film-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 44px;
    height: auto;
    pointer-events: none;
  }

  .gallery img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 1200px) {
    .gallery { column-count: 2; }
  }

  @media (max-width: 600px) {
    .gallery { column-count: 1; column-gap: 0; padding: 0; }
    .gallery a { margin-bottom: 2px; }
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 100;
    cursor: pointer;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  .lightbox.open {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .lightbox.portrait.open {
    justify-content: flex-start;
  }

  .lightbox img {
    display: block;
    max-width: 92vw;
    max-height: 85vh;
    object-fit: contain;
    border: 1px solid #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  .lightbox.portrait img {
    max-height: none;
    max-width: 40vw;
    margin: 32px 0;
  }

  .lightbox-actions {
    padding: 16px 0 24px;
    flex-shrink: 0;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .lightbox-actions a {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }

  .lightbox-actions a:hover {
    color: rgba(255, 255, 255, 0.9);
  }

  .lightbox-actions span {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .lightbox-separator {
    width: 1px;
    height: 12px;
    background: rgba(255, 255, 255, 0.25);
  }
</style>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-actions">
    <a id="lightbox-fullres" href="" target="_blank" rel="noopener">Full res.</a>
    <div class="lightbox-separator" id="lightbox-film-separator" style="display:none;"></div>
    <span id="lightbox-film" style="display:none;"></span>
    <div class="lightbox-separator" id="lightbox-separator" style="display:none;"></div>
    <a id="lightbox-link" href="" target="_blank" rel="noopener" style="display:none;">Details</a>
  </div>
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxFullres = document.getElementById('lightbox-fullres');
  const lightboxSeparator = document.getElementById('lightbox-separator');
  const lightboxLink = document.getElementById('lightbox-link');
  const lightboxFilm = document.getElementById('lightbox-film');
  const lightboxFilmSeparator = document.getElementById('lightbox-film-separator');

  function closeLightbox() {
    lightbox.classList.remove('open', 'portrait');
    lightboxImg.src = '';
    lightboxLink.style.display = 'none';
    lightboxSeparator.style.display = 'none';
    lightboxFilm.style.display = 'none';
    lightboxFilmSeparator.style.display = 'none';
    document.body.style.overflow = '';
  }

  document.querySelector('.gallery').addEventListener('click', function(e) {
    e.preventDefault();
    const link = e.target.closest('a');
    if (!link) return;
    const img = link.querySelector('img');
    const isPortrait = parseInt(img.getAttribute('height')) > parseInt(img.getAttribute('width'));
    lightbox.classList.toggle('portrait', isPortrait);
    lightboxImg.src = link.href;
    lightboxFullres.href = link.href;
    const film = link.dataset.film;
    if (film) {
      lightboxFilm.textContent = film;
      lightboxFilm.style.display = '';
      lightboxFilmSeparator.style.display = '';
    } else {
      lightboxFilm.style.display = 'none';
      lightboxFilmSeparator.style.display = 'none';
    }
    const detailsUrl = link.dataset.details;
    if (detailsUrl) {
      lightboxLink.href = detailsUrl;
      lightboxLink.style.display = '';
      lightboxSeparator.style.display = '';
    } else {
      lightboxLink.style.display = 'none';
      lightboxSeparator.style.display = 'none';
    }
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  });

  lightbox.addEventListener('click', function(e) {
    if (e.target.closest('.lightbox-actions')) return;
    closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) {
      closeLightbox();
    }
  });
</script>
